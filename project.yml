name: Silenium
options:
  bundleIdPrefix: com.vartix
  deploymentTarget:
    iOS: "16.0"
targets:
  Silenium:
    type: application
    platform: iOS
    sources:
      - Silenium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vartix.silenium
        PRODUCT_NAME: Silenium
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Silenium/Info.plist
      properties:
        CFBundleDisplayName: Silenium
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
