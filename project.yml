name: Silenium
options:
  bundleIdPrefix: com.vartix
  deploymentTarget:
    iOS: "15.0"
targets:
  Silenium:
    type: application
    platform: iOS
    sources:
      - Silenium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vartix.silenium
        PRODUCT_NAME: Silenium
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: Silenium/Bridging-Header.h
        # jli ищет main через dlsym(RTLD_DEFAULT, "main"), без экспорта символа падает "could not find executable".
        # -export_dynamic не помог (лог 13:19), явно экспортируем _main
        OTHER_LDFLAGS: "-Wl,-exported_symbol,_main"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Silenium/Info.plist
      properties:
        CFBundleDisplayName: Silenium
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
