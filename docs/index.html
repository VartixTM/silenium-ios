<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silenium</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0d0f1a; color: #e8f7ee; font-family: -apple-system, system-ui, sans-serif; padding: 16px; }
  main { max-width: 520px; width: 100%; text-align: center; }
  h1 { font-size: 40px; margin: 0 0 8px; background: linear-gradient(90deg,#5ed99b,#2475cc);
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { color: #9fb3a8; line-height: 1.5; }
  .btn { display: inline-block; margin-top: 18px; padding: 16px 28px; border-radius: 16px; background: #5e548e;
         color: #fff; text-decoration: none; font-weight: 600; font-size: 18px; }
  .note { font-size: 14px; margin-top: 22px; }
</style>
</head>
<body>
<main>
  <h1>Silenium</h1>
  <p>лаунчер Minecraft Java для iOS. TrollStore.</p>
  <a class="btn" href="https://github.com/VartixTM/silenium-ios/releases/latest">скачать последнюю версию (.ipa)</a>
  <p class="note">минимум iOS 15.0, проверено на 15.8.8 (проверка в процессе). установка через TrollStore.</p>
  <p class="note"><a href="https://github.com/VartixTM/silenium-ios" style="color:#5ed99b">исходники на github</a></p>
</main>
</body>
</html>
