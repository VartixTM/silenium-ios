name: build ipa

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: install xcodegen
        run: brew install xcodegen

      - name: generate project
        run: xcodegen generate

      - name: build (unsigned, for trollstore)
        run: |
          xcodebuild \
            -project Silenium.xcodeproj \
            -scheme Silenium \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: package ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "Silenium.app" | head -n 1)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Silenium.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Silenium-ipa
          path: Silenium.ipa

      - name: release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Silenium.ipa
