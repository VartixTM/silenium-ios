name: build ipa

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: install xcodegen
        run: brew install xcodegen

      - name: set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: \"$VERSION\"/" project.yml
          sed -i '' "s/CFBundleShortVersionString: .*/CFBundleShortVersionString: \"$VERSION\"/" project.yml
          echo "version: $VERSION"

      - name: generate project
        run: xcodegen generate

      - name: build (unsigned, for trollstore)
        run: |
          xcodebuild \
            -project Silenium.xcodeproj \
            -scheme Silenium \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: download java runtimes (amethyst host)
        run: |
          mkdir -p jre-work jre-out
          for v in 8 17 21; do
            curl -fSL -o "jre-work/jre$v.zip" "https://assets.angelauramc.dev/openjdk/ios-arm64/jre$v-ios-aarch64.zip"
            (cd jre-work && unzip -q "jre$v.zip" && rm "jre$v.zip")
            mkdir -p "jre-out/$v"
            tar -xJf jre-work/jre$v-*.tar.xz -C "jre-out/$v"
          done

      - name: put runtimes into app and sign for trollstore
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "Silenium.app" | head -n 1)
          test -n "$APP"
          mkdir -p "$APP/java"
          cp -R jre-out/. "$APP/java/"
          brew install ldid
          BIN="$APP/Silenium"
          file "$BIN"
          # диагностика: экспортируется ли main (jli делает dlsym(RTLD_DEFAULT, "main"))
          nm -gU "$BIN" | grep -w main || echo "NO EXPORTED main"
          otool -l "$BIN" | grep -A3 LC_CODE_SIGNATURE || true
          # linker-signed (ad-hoc от ld) ldid 2.1.5 падает на _assert, снимаем подпись перед переподписью
          codesign --remove-signature "$BIN" || true
          if ! ldid -S"entitlements.trollstore.xml" "$BIN"; then
            echo "ldid failed, fallback to codesign"
            codesign -f -s - --entitlements entitlements.trollstore.xml "$BIN"
          fi
          ldid -e "$BIN" || true

      - name: package ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "Silenium.app" | head -n 1)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Silenium.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Silenium-ipa
          path: Silenium.ipa

      - name: release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Silenium ${{ github.ref_name }}
          files: Silenium.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
